version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=bnpu
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Remove POSTGRES_HOST_AUTH_METHOD for production (only for development)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bnpu-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bnpu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_NAME=bnpu
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
    volumes:
      - ./:/app  # Critical for local migration visibility
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bnpu-network

volumes:
  postgres_data:

networks:
  bnpu-network:
    driver: bridge